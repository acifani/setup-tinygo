name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          # - windows-11-arm - Binaryen does not provide binaries for Windows on ARM as of v123
        tinygo: ['0.39.0', '0.40.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: setup-tinygo ${{ matrix.tinygo }}
        uses: ./
        with:
          tinygo-version: ${{ matrix.tinygo }}
          binaryen-version: '129'

      - name: Verify version
        run: ./check-version.sh ${{ matrix.tinygo }}
        shell: bash

      - name: Test build
        run: ./test-build.sh
        shell: bash

  no-binaryen:
    name: No Binaryen
    # using macos because ubuntu has binaryen pre-installed
    # TO-DO: implement a stable testing method
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: setup-tinygo
        uses: ./
        with:
          tinygo-version: '0.40.1'
          install-binaryen: 'false'

      - name: Binaryen not installed
        run: ./test-binaryen.sh
        shell: bash
